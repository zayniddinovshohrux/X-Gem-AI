<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X-Gem AI</title>
    <link rel="shortcut icon" type="image/x-icon" href="X-Gem_icon.png" />
    <link rel="manifest" href="manifest.json" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <style>
      @import url(https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;800;900&display=swap);

      :root {
        --ios-yellow: #ffcc00;
        --ios-blue: #007aff;
        --ios-background: #000000;
        --ios-card: #1c1c1e;
        --ios-gray: #8e8e93;
        --ios-light-gray: #38383a;
        --ios-red: #ff3b30;
        --ios-green: #30d158;
        --ios-white: #f7f7f7;
        --ios-orange: #ff9500;
        --ios-purple: #af52de;
        --ios-teal: #5ac8fa;
        --ios-pink: #ff2d55;
        --ios-indigo: #5856d6;
        --font: Inter, sans-serif;
        --shadow:
          0 6px 18px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(255, 0, 0, 0.04),
          inset 0 0.2px 0 rgba(255, 255, 255, 0.33);

        --element-shadow:
          0 2px 4px rgba(0, 0, 0, 0.25),
          inset 0 1px 1px rgba(255, 255, 255, 0.35),
          inset 0 -1px 2px rgba(0, 0, 0, 0.25);

        --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.12);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        --blur-border: rgba(255, 255, 255, 0.08);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        text-decoration: none;
      }

      body {
        font-family: "Inter", sans-serif;
        display: flex;
        background: var(--ios-background);
        justify-content: center;
        align-items: center;
        user-select: none;
      }

      .chat-container {
        width: 100%;
        height: 100%;

        overflow: hidden;
        background: var(--ios-background);
        position: fixed;
        bottom: 20px;
      }

      .header {
        background: rgba(28, 28, 30, 0.7);
        backdrop-filter: blur(7px) saturate(120%);
        -webkit-backdrop-filter: blur(7px) saturate(120%);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.15);
        color: white;
        padding: 5px;
        text-align: center;
      }

      .icon {
        font-size: 24px;
        margin-top: 20px;
        font-weight: 600;
      }

      .messages {
        overflow-y: auto;
        padding: 20px;
        background: transparent;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
      }

      .user-message {
        justify-content: flex-end;
      }

      .bot-message {
        justify-content: flex-start;
      }

      .message-content {
        max-width: 70%;
        padding: 10px 15px;
        border-radius: 16px;
        position: relative;
        background: rgba(28, 28, 30, 0.7);
        backdrop-filter: blur(10px) saturate(120%);
        user-select: text;
        -webkit-backdrop-filter: blur(10px) saturate(120%);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
      }

      .user-message .message-content {
        background: var(--ios-blue);
        color: var(--ios-white);
        box-shadow: var(--element-shadow);
      }

      .bot-message .message-content {
        background: rgba(28, 28, 30, 0.7);
        color: var(--ios-white);
        box-shadow: var(--shadow);
      }

      .avatar {
        display: none;
      }

      .input-area {
        padding: 14px;
        background: rgba(28, 28, 30, 0.7);
        backdrop-filter: blur(7px) saturate(120%);
        -webkit-backdrop-filter: blur(7px) saturate(120%);
        box-shadow: var(--shadow);
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        display: flex;
        gap: 10px;
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 36px;
        width: 100%;
        max-width: 800px;

        justify-content: center;
        color: var(--ios-white);
        margin: auto;
      }

      #userInput {
        flex: 1;
        padding-left:10px;
        background: transparent;
        border: none;
        outline: none;
        color: var(--ios-white);
        font-size: 16px;
      }

      #userInput::placeholder {
        color: var(--ios-gray);
        font-size: 16px;
      }

      #sendBtn {
        padding: 10px;
        background: var(--ios-blue);
        box-shadow: var(--element-shadow);
        color: var(--ios-white);
        border: none;
        border-radius: 50%;
        cursor: pointer;
        text-align: center;
        font-size: 18px;
      }

      #sendBtn:hover {
        background: var(--ios-blue);
      }

      .typing {
        background: rgba(28, 28, 30, 0.7);
        padding: 10px 15px;
        box-shadow: var(--shadow);
        border-radius: 16px;
        border: 0.5px solid rgba(255, 255, 255, 0.15);
        display: inline-block;
      }

      .typing span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: var(--ios-white);
        border-radius: 50%;
        margin: 0 2px;
        animation: typing 1s infinite;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing span:nth-child(3) {
        animation-delay: 0.4s;
      }

      .message-content::selection {
        background: var(--ios-yellow);
        color: white;
      }

      .message-content::-webkit-selection {
        background: var(--ios-yellow);
        color: white;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }

      @media (max-width: 1000px) {
        .input-area {
          transform: translateX(-50%);
          bottom: 10px;
          border-radius: 36px;
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="header">
        <img
          src="./xgem_icon.png"
          class="icon"
          style="width: 40px; height: 40px"
        />
      </div>

      <div class="messages" id="messages">
        <div class="message bot-message">
          <div class="message-content">
            X-Gem
          </div>
        </div>
      </div>

      <div class="input-area">
        <input type="text" id="userInput" placeholder="X-Gem Started..." />
        <button id="sendBtn" onclick="sendMessage()">
          <i class="fas fa-paper-plane"></i>
        </button>
      </div>
    </div>

    <script>
      const messagesDiv = document.getElementById("messages");
      const userInput = document.getElementById("userInput");

      // Enter tugmasi
      userInput.addEventListener("keypress", function (e) {
        if (e.key === "Enter") {
          sendMessage();
        }
      });

      async function sendMessage() {
        const message = userInput.value.trim();

        if (message.toLowerCase() === "exit") {
          addMessage("Xayr! 👋", "bot");
          userInput.value = "";
          return;
        }

        if (message === "") return;

        // Foydalanuvchi xabarini qo'shish
        addMessage(message, "user");
        userInput.value = "";

        // Typing indicator
        showTyping();

        try {
          // API ga so'rov yuborish
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ message: message }),
          });

          const data = await response.json();

          // Typing indicator ni olib tashlash
          removeTyping();

          if (data.success) {
            addMessage(data.response, "bot");
          } else {
            addMessage("Xatolik yuz berdi", "bot");
          }
        } catch (error) {
          removeTyping();
          addMessage("Internet aloqasini tekshiring", "bot");
          console.error(error);
        }
      }

      function addMessage(text, sender) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${sender}-message`;

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = sender === "user" ? "" : "";

        const content = document.createElement("div");
        content.className = "message-content";
        content.textContent = text;

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(content);

        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      function showTyping() {
        const typingDiv = document.createElement("div");
        typingDiv.className = "message bot-message";
        typingDiv.id = "typingIndicator";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = "";

        const indicator = document.createElement("div");
        indicator.className = "typing";
        indicator.innerHTML = "<span></span><span></span><span></span>";

        typingDiv.appendChild(avatar);
        typingDiv.appendChild(indicator);

        messagesDiv.appendChild(typingDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        document.getElementById("sendBtn").disabled = true;
        userInput.disabled = true;
      }

      function removeTyping() {
        const typing = document.getElementById("typingIndicator");
        if (typing) {
          typing.remove();
        }

        document.getElementById("sendBtn").disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }

      document.addEventListener("contextmenu", (e) => e.preventDefault());

      document.addEventListener("keydown", function (e) {
        if (e.ctrlKey && (e.key === "c" || e.key === "u" || e.key === "s")) {
          e.preventDefault();
        }
      });
    </script>
  </body>
</html>
